[package]
name = "arachne-cli"
edition = "2024"
description = "CLI tool for Arachne"
version.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[[bin]]
name = "arachne"
path = "src/main.rs"

[dependencies]
ecore_rs = { version = "*", path = "../arachne-parser" }
arachne-codegen = { version = "*", path = "../arachne-codegen" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
colored = "3.1"
env_logger = "0.11.9"
log = "0.4.34"
serde_json = "1.0"
