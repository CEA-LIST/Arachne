[package]
name = "arachne-cli"
version = "0.2.1"
edition = "2024"
description = "CLI tool for Arachne"

[[bin]]
name = "arachne"
path = "src/main.rs"

[dependencies]
ecore_rs = { version = "*", path = "../arachne-parser" }
arachne-codegen = { version = "*", path = "../arachne-codegen" }
anyhow = "1.0"
clap = { version = "4.5.31", features = ["derive", "env"] }
colored = "2.1"
env_logger = "0.11.9"
log = "0.4.29"
serde_json = "1.0"
# Live imports use the same synchronous HTTP client as Moirai's node drivers.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
# `import-sirius`: the table a node merges by, and the operations it takes, from the same
# Moirai checkout `arachne-codegen` builds against, so the importer cannot drift from either.
moirai-semantics = { version = "*", path = "../../moirai-model-plane/moirai-semantics" }
moirai-interp = { version = "*", path = "../../moirai-model-plane/moirai-interp", default-features = false, features = ["serde"] }

[dev-dependencies]
# EC.M1b: MD.08's shipped-hash check, carried with its test from arachne-codegen (already in the lock).
sha2 = "0.10"
