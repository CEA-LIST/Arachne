name: CI

# Format, lint and unit tests for the Arachne workspace.
#
# NOTE: arachne-codegen depends on Moirai through *relative paths*
# (`../../moirai/moirai-protocol`, `-crdt`, `-macros`), so Arachne cannot be
# built alone. Every job therefore checks out both repositories as siblings:
#
#   $GITHUB_WORKSPACE/
#   ├── arachne/   <- this repo
#   └── moirai/    <- Moirai-mddf
#
# Moirai-mddf is private, so the checkout needs a token with read access to it.
# Add a repository secret named MOIRAI_TOKEN (fine-grained PAT, or a deploy
# key) before enabling this workflow, otherwise every job fails at checkout.
#
# MOIRAI_REF must point at a Moirai branch that builds on stable Rust — i.e.
# one that no longer carries `#![feature(let_chains)]` in moirai-protocol and
# moirai-crdt (E0554 on Rust >= 1.88). Update it once that fix has landed.

on:
  push:
    branches: [main, 1-newtwork]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MOIRAI_REPO: ${{ vars.MOIRAI_REPO || 'Marcosddf/Moirai-mddf' }}
  MOIRAI_REF: ${{ vars.MOIRAI_REF || '26-network' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    # TODO(ci): flip to blocking once the formatting backlog is cleared.
    # Baseline on 1-newtwork: 50 files are not rustfmt-clean.
    continue-on-error: true
    steps:
      # Formatting needs only this repo — no Moirai checkout required.
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    # TODO(ci): flip to blocking (and add `-- -D warnings`) once the lint
    # backlog is cleared. Baseline on 1-newtwork: 5 warnings.
    continue-on-error: true
    steps:
      - name: Check out Arachne
        uses: actions/checkout@v4
        with:
          path: arachne
      - name: Check out Moirai (relative path dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MOIRAI_REPO }}
          ref: ${{ env.MOIRAI_REF }}
          token: ${{ secrets.MOIRAI_TOKEN }}
          path: moirai
      - name: Install clippy
        run: rustup component add clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            arachne/target
          key: ${{ runner.os }}-clippy-${{ hashFiles('arachne/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - name: cargo clippy
        working-directory: arachne
        run: cargo clippy --workspace --all-targets

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Arachne
        uses: actions/checkout@v4
        with:
          path: arachne
      - name: Check out Moirai (relative path dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MOIRAI_REPO }}
          ref: ${{ env.MOIRAI_REF }}
          token: ${{ secrets.MOIRAI_TOKEN }}
          path: moirai
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            arachne/target
          key: ${{ runner.os }}-test-${{ hashFiles('arachne/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - name: cargo build
        working-directory: arachne
        run: cargo build --workspace --all-targets
      - name: cargo test
        working-directory: arachne
        # Four tests are skipped because the .ecore fixtures they load are
        # referenced by the code but were never committed to this branch:
        #   examples/Company.ecore
        #   examples/concrete_inherits_concrete.ecore
        #   examples/concrete_polymorphic_targets.ecore
        # They fail with FileRead(NotFound) on any clean checkout, not just CI.
        # TODO(ci): commit the missing fixtures, then drop these --skip flags.
        run: |
          cargo test --workspace -- \
            --skip preserves_subclasses_for_forward_referenced_supertypes \
            --skip concrete_superclass_with_subclasses_emits_family_union \
            --skip containment_typed_by_concrete_superclass_uses_family_log \
            --skip non_containment_reference_typed_by_concrete_superclass_expands_to_family
