[package]
name = "arachne-codegen"
version = "0.3.1"
edition = "2024"
description = "Code generator for Arachne"

[dependencies]
ecore_rs = { version = "*", path = "../arachne-parser" }
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = "3.0.6"
prettyplease = "0.3"
anyhow = "1.0"
thiserror = "2.0"
rustc-hash = "2.1.3"
heck = "0.5.0"
log = "0.4.29"
owo-colors = "4"
arachne-xmi = { version = "*", path = "../arachne-xmi" }
# `describe`: the descriptor, its digest, and the merge rules read from `moirai-semantics`.
# `Serialize` on the shared merge vocabulary, so the descriptor and
# `moirai-semantics`'s parser cannot drift on a tag name.
serde = "1.0"
serde_json = "1.0"
# The metamodel digest: SHA-256 over the compact descriptor. Keep `serde_json`
# without `preserve_order`, or the digest would depend on a file's key order.
sha2 = "0.10"
moirai-semantics = { version = "*", path = "../../moirai-model-plane/moirai-semantics" }
# `resources.rs` scans Ecore text for relative resource references; the merged parser no longer re-exports it.
regex = "1.6"
