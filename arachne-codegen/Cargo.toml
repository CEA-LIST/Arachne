[package]
name = "arachne-codegen"
version = "0.2.0"
edition = "2024"
description = "Code generator for Arachne"

[dependencies]
ecore_rs = { version = "*", path = "../arachne-parser" }
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = "2.0.114"
prettyplease = "0.2.37"
anyhow = "1.0"
thiserror = "1.0"
rustc-hash = "2.1.1"
heck = "0.5.0"
log = "0.4.29"
owo-colors = "4"
xml-builder = "0.5.4"
moirai-protocol = { git = "https://github.com/CEA-LIST/Moirai.git", tag = "v0.5" }
moirai-crdt = { git = "https://github.com/CEA-LIST/Moirai.git", tag = "v0.5" }
moirai-macros = { git = "https://github.com/CEA-LIST/Moirai.git", tag = "v0.5" }
